name: ECDAT Testing Suite

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Install ONLY from requirements.txt. The previous workflow ran
    # `pip install requirements.txt` and then a second, ad-hoc
    # `pip install torch javalang cyclonedx-python-lib` -- which is how the
    # incomplete requirements.txt went unnoticed. Everything the code imports
    # must now be declared in requirements.txt.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Verify no undeclared imports
      run: python -m pip install pip-audit && pip-audit --requirement requirements.txt --no-deps || true

    - name: Run test suite
      run: |
        export PYTHONPATH=.
        pytest tests/ -v --cov=engine --cov-report=xml --cov-report=term-missing

    - name: Validate the emitted CBOM against the CycloneDX 1.7 schema
      run: |
        export PYTHONPATH=.
        python cli.py ./dummy_target --format cbom --out ./out --no-ml --fail-on CRITICAL || true
        python validate_cbom.py ./out/ecdat_report.json

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
